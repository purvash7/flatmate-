name: Repair auth DB fallback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth middleware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          old_import = "import { UserProfile, MatchItem, MessageItem, DiscoverFilters } from './src/types.js';"
          new_import = old_import + "\nimport { db } from './src/db/index.ts';\nimport { users as pgUsers } from './src/db/schema.ts';\nimport { eq } from 'drizzle-orm';"
          if "import { users as pgUsers } from './src/db/schema.ts';" not in s:
              if old_import not in s:
                  raise SystemExit('Expected type import not found')
              s = s.replace(old_import, new_import, 1)
          old = """  const requireAuth = (req: express.Request, res: express.Response, next: express.NextFunction) => {\n    const authHeader = req.headers.authorization;\n    const token = authHeader && authHeader.startsWith('Bearer ') ? authHeader.substring(7) : null;\n    \n    if (!token) {\n      return res.status(401).json({ error: 'Authentication required. Please log in.' });\n    }\n\n    const payload = verifyAuthToken(token);\n    if (!payload) {\n      return res.status(401).json({ error: 'Session expired. Please log in again.' });\n    }\n\n    const user = users.get(payload.userId);\n    if (!user) {\n      return res.status(401).json({ error: 'Account not found or deleted.' });\n    }\n\n    (req as any).user = user;\n    next();\n  };"""
          new = """  const requireAuth = async (req: express.Request, res: express.Response, next: express.NextFunction) => {\n    const authHeader = req.headers.authorization;\n    const token = authHeader && authHeader.startsWith('Bearer ') ? authHeader.substring(7) : null;\n    \n    if (!token) {\n      return res.status(401).json({ error: 'Authentication required. Please log in.' });\n    }\n\n    const payload = verifyAuthToken(token);\n    if (!payload) {\n      return res.status(401).json({ error: 'Session expired. Please log in again.' });\n    }\n\n    // The app uses PostgreSQL as durable storage, while the in-memory map is a\n    // request cache. On Render, a request can land on a different instance\n    // (or immediately after a restart), so never treat a cache miss as a\n    // deleted account. Recover the user from PostgreSQL and warm the cache.\n    let user: any = users.get(payload.userId);\n    if (!user) {\n      try {\n        const rows = await db.select().from(pgUsers).where(eq(pgUsers.id, payload.userId)).limit(1);\n        const row = rows[0];\n        if (row) {\n          user = {\n            id: row.id,\n            email: row.email,\n            phone: row.phone || '',\n            password_hash: row.passwordHash || '',\n            phone_verified: !!row.phoneVerified,\n            email_verified: !!row.emailVerified,\n            google_id: row.googleId || undefined,\n            created_at: row.createdAt?.toISOString?.() || new Date().toISOString()\n          };\n          users.set(row.id, user);\n        }\n      } catch (error) {\n        console.error('PostgreSQL auth lookup failed:', error);\n        return res.status(503).json({ error: 'Account verification is temporarily unavailable. Please try again.' });\n      }\n    }\n\n    if (!user) {\n      return res.status(401).json({ error: 'Account not found or deleted.' });\n    }\n\n    (req as any).user = user;\n    next();\n  };"""
          if old not in s:
              raise SystemExit('Expected requireAuth block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove repair workflow
        run: rm -f .github/workflows/repair-auth-postgres-fallback.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts .github/workflows/repair-auth-postgres-fallback.yml
          git commit -m "Fix auth cache miss against PostgreSQL" || exit 0
          git push
