name: Repair onboarding compile error

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix sleep schedule shorthand
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/OnboardingFlow.tsx')
          s = p.read_text()
          old = 'cleanliness,sleep_schedule,social_level'
          new = 'cleanliness,sleep_schedule:sleepSchedule,social_level'
          if old not in s:
              raise SystemExit('Expected onboarding persistence expression was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/repair-onboarding-sleep-schedule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/OnboardingFlow.tsx .github/workflows/repair-onboarding-sleep-schedule.yml
          git commit -m 'Fix onboarding sleep schedule save error'
          git push
